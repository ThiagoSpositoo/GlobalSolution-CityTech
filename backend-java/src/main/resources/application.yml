spring:
  application:
    name: citytech-java
  datasource:
    url: ${ORACLE_JDBC_URL}
    username: ${ORACLE_USERNAME}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

server:
  port: ${JAVA_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

citytech:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:19006,http://127.0.0.1:19006,http://localhost:8081,http://127.0.0.1:8081}
  security:
    issuer: ${JWT_ISSUER:citytech-identity}
    audience: ${JWT_AUDIENCE:citytech-api}
    key-id: ${JWT_KEY_ID:citytech-local-v1}
    public-key-path: ${JWT_PUBLIC_KEY_PATH}
  messaging:
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    publisher-delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:2000}
  ai:
    chat-model: ${AI_CHAT_MODEL:configured-chat-model}
